version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinelforge-postgres
    environment:
      POSTGRES_USER: sentinelforge
      POSTGRES_PASSWORD: sentinelforge_secret_pass
      POSTGRES_DB: sentinelforge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelforge -d sentinelforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  neo4j:
    image: neo4j:5.18-community
    container_name: sentinelforge-neo4j
    environment:
      NEO4J_AUTH: neo4j/sentinelforge_graph_pass
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    volumes:
      - neo4jdata:/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sentinelforge-api
    environment:
      DATABASE_URL: postgresql://sentinelforge:sentinelforge_secret_pass@postgres:5432/sentinelforge_db
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sentinelforge_graph_pass
      JWT_SECRET: super_secure_sentinelforge_jwt_key_2026
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started

  workers:
    build:
      context: ./apps/workers
      dockerfile: Dockerfile
    container_name: sentinelforge-workers
    privileged: true # Required for QEMU / kernel module network emulation
    environment:
      REDIS_URL: redis://redis:6379/0
      API_URL: http://api:8000
    depends_on:
      - redis
      - api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sentinelforge-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  neo4jdata:
